<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a56db">
<title>Conversational Agents</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/app.css">
<script>try { var t = localStorage.getItem('cxa-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<header class="topbar">
  <button class="iconbtn only-mobile" id="nav-toggle" aria-label="Open navigation" aria-expanded="false"></button>
  <a class="brand" href="#/projects" aria-label="Conversational Agents home"><span class="logo"></span><span class="brand-name">Conversational Agents</span></a>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="spacer"></div>
  <div class="top-actions" id="top-actions">
    <button class="iconbtn" id="theme-toggle" aria-label="Toggle theme"></button>
    <button class="btn primary sim-btn" id="toggle-sim" title="Open the simulator"></button>
  </div>
</header>
<div class="layout">
  <aside class="sidenav" id="sidenav" aria-label="Agent navigation"></aside>
  <div class="scrim" id="scrim"></div>
  <main id="main" class="main"></main>
  <section class="sim hidden" id="sim" aria-label="Simulator"></section>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
