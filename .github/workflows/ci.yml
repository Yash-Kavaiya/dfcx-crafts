name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --locked || cargo build --workspace
      - run: cargo test --workspace
      - run: cargo run -q -p cxa -- test examples/pizza-agent.json
      - run: cargo run -q -p cxa -- test examples/travel-playbook-agent.json
      - run: cargo run -q -p cxa -- test examples/help-center-agent.json
      - run: node --check crates/cx-server/assets/app.js

  docker:
    # Validates the production image on every push / PR (deploys happen in
    # deploy-cloud-run.yml on main).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cxa:ci .
      - name: Container smoke test
        run: |
          docker run -d --name cxa -p 8080:8080 -e CXA_SEED=/app/examples/pizza-agent.json cxa:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS -X POST localhost:8080/v3/projects/demo/locations/global/agents/rusty-pizza/sessions/ci:detectIntent \
            -H 'Content-Type: application/json' -d '{"queryInput":{"text":{"text":"hi"}}}' | grep -q "Rusty Pizza"
          docker logs cxa

  e2e:
    # Drives every console feature in Chromium (desktop + phone) against the
    # real server, plus a latency budget and API-key mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release --locked -p cxa
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: node e2e/console.e2e.mjs
